name: monitor-platform

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor_platform}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/server/migrations/postgres/000001_create_users.up.sql:/docker-entrypoint-initdb.d/000001_create_users.sql:ro
      - ./apps/server/migrations/postgres/000002_create_projects.up.sql:/docker-entrypoint-initdb.d/000002_create_projects.sql:ro
      - ./apps/server/migrations/postgres/000003_create_ingestion_batches.up.sql:/docker-entrypoint-initdb.d/000003_create_ingestion_batches.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1.1315
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor_platform
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-monitor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monitor_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./apps/server/migrations/clickhouse/000001_create_telemetry_events.sql:/docker-entrypoint-initdb.d/000001_create_telemetry_events.sql:ro
      - ./apps/server/migrations/clickhouse/000002_enable_insert_deduplication.sql:/docker-entrypoint-initdb.d/000002_enable_insert_deduplication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 4194304
      KAFKA_REPLICA_FETCH_MAX_BYTES: 4194304
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TELEMETRY_TOPIC: ${KAFKA_TELEMETRY_TOPIC:-telemetry-batches}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic "$$KAFKA_TELEMETRY_TOPIC"
        --partitions 1 --replication-factor 1
        --config retention.ms=604800000 --config max.message.bytes=4194304

volumes:
  postgres_data:
  clickhouse_data:
  kafka_data:
