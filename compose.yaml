name: monitor-platform

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor_platform}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/server/migrations/000001_create_projects.up.sql:/docker-entrypoint-initdb.d/000001_create_projects.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1.1315
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor_platform
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-monitor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monitor_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./apps/server/clickhouse/000001_create_telemetry_events.sql:/docker-entrypoint-initdb.d/000001_create_telemetry_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  clickhouse_data:
